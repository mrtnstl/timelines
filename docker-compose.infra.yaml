services:
  db:
    image: postgres:18
    container_name: timelines-db
    restart: unless-stopped
    env_file:
      - .env.infra
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: "pg_isready -h localhost -p 5432 -d ${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  cache:
    image: redis:8
    container_name: timelines-cache
    restart: unless-stopped
    env_file:
      - .env.infra
    volumes:
      - redis-data:/var/lib/redis/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  db-data:
  redis-data: